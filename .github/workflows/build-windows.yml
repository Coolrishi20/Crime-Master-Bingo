name: Build Windows app

# Every push to main builds the Windows EXEs and publishes release v<package.json version>
# automatically (once per version). Tags, published releases and manual runs also build.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Ed25519 private key (PEM) for signing release files. Installed copies from 2.4 on only
      # install updates signed with the matching key built into the app (src/main/updsig.js).
      ANTHEM_UPDATE_SIGNING_KEY: ${{ secrets.ANTHEM_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node tools/fetch-ffmpeg.js win32-x64
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Sign the release files
        if: env.ANTHEM_UPDATE_SIGNING_KEY != ''
        run: node tools/sign-release.js dist
      - name: Warn when the release is not signed
        if: env.ANTHEM_UPDATE_SIGNING_KEY == ''
        shell: bash
        run: echo "::warning::ANTHEM_UPDATE_SIGNING_KEY is not set — this release is NOT signed, so copies from 2.4 on will offer it only as a manual download."
      - uses: actions/upload-artifact@v4
        with:
          name: AnthemSquare-Windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/release-signature.*

      - name: Work out the release version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          # versions like 1.5.0-rc.1 are release candidates: published as a GitHub pre-release,
          # which installed copies do NOT auto-update to (testers download it manually)
          case "$v" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          if gh release view "$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish a new release (push to main, new version only)
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anthem Square ${{ steps.ver.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          make_latest: ${{ steps.ver.outputs.pre == 'true' && 'false' || 'true' }}
          # latest.yml + blockmaps let installed copies update themselves
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/release-signature.*

      - name: Attach the EXEs to a published release / tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/release-signature.*
