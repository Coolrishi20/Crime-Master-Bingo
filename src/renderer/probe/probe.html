<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; media-src file: data: blob:; img-src file: data: blob:; script-src 'self' file:">
<title>Anthem Square — media probe</title>
</head>
<body>
<!-- Hidden helper window: checks that each imported video plays in this app (duration,
     size, codec) and grabs a small thumbnail. It runs separately from the host and TV
     windows and is closed after a batch, so the memory used by decoding is given back. -->
<video id="v" muted preload="metadata"></video>
<canvas id="c" width="320" height="180"></canvas>
<script src="probe.js"></script>
</body>
</html>
